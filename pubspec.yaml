name: untitled3
description: A new Flutter project.


publish_to:
version: 1.0.0+1

environment:
  sdk: ^3.10.3


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.2
  dio: ^5.9.0
  analyzer: 9.0.0
  go_router: ^17.0.1
  retrofit: ^4.9.2
  json_serializable: ^6.11.4
  json_annotation: ^4.9.0
  bloc: ^9.2.0
  google_fonts: ^7.1.0
  url_launcher: ^6.3.2
  shimmer: ^3.0.0
  animate_do: ^4.2.0
  carousel_slider: ^5.1.1
  cached_network_image: ^3.4.1
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.4
  provider: ^6.1.5+1
  dartz: ^0.10.1
  internet_connection_checker: ^3.0.1
  pretty_dio_logger: ^1.4.0
  #flutter_pretty_dio_logger: ^3.0.0
  get_it: ^9.2.0
  curved_navigation_bar: ^1.0.6
  conditional_builder_null_safety: ^0.0.6
  animated_text_kit: ^4.3.0
  lottie: ^3.3.2
  smooth_page_indicator: ^2.0.1

dev_dependencies:
  retrofit_generator: ^10.2.1
  build_runner: ^2.10.5
  rename: ^3.1.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/image/clapperboard.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/image/clapperboard.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/image/clapperboard.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/image/clapperboard.png"


  flutter_lints: ^1.0.0


flutter:


  uses-material-design: true

  assets:
    - assets/image/
  #   - images/a_dot_ham.jpeg


  fonts:
    - family: Schyler
      fonts:
        - asset: assets/MyFlutterApp.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
